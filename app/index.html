  <div class="cta"><a class="b1" style="display:grid;place-items:center;text-decoration:none" href="https://wa.me/${WA_DUV}?text=${encodeURIComponent('Oi! Sou personal trainer e quero testar o app.')}" target="_blank" rel="noopener">Falar no WhatsApp</a><button class="b2 nb" id="lg">Já tenho conta • Entrar</button></div></div>`;

/* ---------- login ---------- */
function login(){R.innerHTML=`<div class="scr"><div class="nav"><button class="bk" id="bk">‹</button></div><p class="q">Entrar</p><p class="qs">Use o e-mail e a senha que você criou.</p>
  <span class="lb">E-mail</span><input class="in" id="em" type="email" autocomplete="email" inputmode="email" placeholder="seu@email.com">
  <span class="lb">Senha</span><div class="pw"><input class="in" id="pw" type="password" autocomplete="current-password" placeholder="Sua senha"><button id="sh" type="button">mostrar</button></div>
  <p class="err" id="er"></p>
  <div class="cta"><button class="b1" id="go">Entrar</button><button class="b2 nb" id="fg">Esqueci minha senha</button></div></div>`;
  $('#bk').onclick=welcome;$('#sh').onclick=()=>{const i=$('#pw');i.type=i.type==='password'?'text':'password';$('#sh').textContent=i.type==='password'?'mostrar':'esconder'};
  $('#fg').onclick=()=>{$('#er').innerHTML=`Fale com o ${PN} que ele redefine sua senha. <a class="link" href="https://wa.me/${WA_DUV}?text=${encodeURIComponent('Oi, '+PN+'! Esqueci minha senha do app.')}" target="_blank" rel="noopener">Abrir WhatsApp</a>`};
  $('#go').onclick=async()=>{const em=$('#em').value.trim(),pw=$('#pw').value;if(!em||!pw){$('#er').textContent='Preencha e-mail e senha.';return}
    $('#go').disabled=true;const {error}=await sb.auth.signInWithPassword({email:em,password:pw});$('#go').disabled=false;
    if(error){$('#er').textContent=/Invalid/i.test(error.message)?'E-mail ou senha não conferem.':'Não deu para entrar agora. Tente de novo.';return}route()}}

/* ---------- convite ---------- */
function askCode(){R.innerHTML=`<div class="scr"><div class="nav"><button class="bk" id="bk">‹</button></div><p class="q">Seu convite</p><p class="qs">Abra o link que o ${PN} mandou no seu WhatsApp, ou digite o código de 6 letras.</p>
  <span class="lb">Código do convite</span><input class="in" id="cd" maxlength="6" autocapitalize="characters" placeholder="Ex.: A1B2C3" style="text-transform:uppercase;letter-spacing:3px">
  <p class="err" id="er"></p><div class="cta"><button class="b1" id="go">Continuar</button></div></div>`;
  $('#bk').onclick=welcome;$('#go').onclick=()=>{ST.code=$('#cd').value.trim().toUpperCase();if(ST.code.length<6){$('#er').textContent='O código tem 6 letras ou números.';return}openInvite()}}
async function openInvite(){R.innerHTML='<div class="ld">Abrindo seu convite…</div>';
  const {data,error}=await sb.rpc('invite_info',{p_code:ST.code});const inv=data&&data[0];
  if(error||!inv){R.innerHTML=`<div class="scr"><div class="nav"><button class="bk" id="bk">‹</button></div><p class="q">Convite não encontrado</p><p class="qs">Esse convite não existe ou já foi usado. Peça um novo ao ${PN}, ou entre se você já tem conta.</p><div class="cta"><button class="b1" id="lg">Entrar</button><button class="b2 nb" id="bk2">Voltar</button></div></div>`;const out=()=>{ST.code='';try{history.replaceState(null,'','/app/')}catch(_){}welcome()};$('#bk').onclick=$('#bk2').onclick=out;$('#lg').onclick=()=>{ST.code='';try{history.replaceState(null,'','/app/')}catch(_){}login()};return}
  ST.inv=inv;const nm=(inv.name||'').split(' ')[0];
  R.innerHTML=`<div class="scr wl"><div class="gl"></div><span class="br">CHAMES CREW</span><span class="ey" style="margin-top:44px">CONVITE DO ${PN.toUpperCase()}</span>
  <h1 style="font-size:clamp(50px,16vw,70px)">${nm?`Bem-vindo(a),<br><span>${esc(nm)}</span>`:'Bem-vindo(a)'}</h1>
  <p class="qs" style="margin-top:14px">Crie seu acesso. Depois são perguntas rápidas, uma por tela.</p>
  <span class="lb">Seu e-mail</span><input class="in" id="em" type="email" autocomplete="email" inputmode="email" placeholder="seu@email.com">
  <span class="lb">Crie uma senha</span><div class="pw"><input class="in" id="pw" type="password" autocomplete="new-password" placeholder="Pelo menos 8 caracteres"><button id="sh" type="button">mostrar</button></div>
  <span class="lb">Confirme a senha</span><div class="pw"><input class="in" id="pw2" type="password" autocomplete="new-password" placeholder="Digite a mesma senha de novo"></div>
  <p class="err" id="er"></p><div class="cta"><button class="b1" id="go">Criar minha conta</button></div></div>`;
  $('#sh').onclick=()=>{const t=$('#pw').type==='password'?'text':'password';$('#pw').type=t;$('#pw2').type=t;$('#sh').textContent=t==='password'?'mostrar':'esconder'};
  $('#pw2').oninput=()=>{const a=$('#pw').value,b=$('#pw2').value;$('#er').textContent=b&&a.slice(0,b.length)!==b?'As senhas não estão iguais.':''};
  $('#go').onclick=async()=>{const em=$('#em').value.trim(),pw=$('#pw').value,pw2=$('#pw2').value;
    if(!/^\S+@\S+\.\S+$/.test(em)){$('#er').textContent='Confira o e-mail.';return}if(pw.length<8){$('#er').textContent='A senha precisa ter pelo menos 8 caracteres.';return}
    if(pw!==pw2){$('#er').textContent='As senhas não estão iguais. Digite de novo.';$('#pw2').value='';$('#pw2').focus();return}
    $('#go').disabled=true;$('#go').textContent='Criando…';
    if(inv.claim){/* aluno cadastrado pelo personal: a conta já existe, ele só define e-mail e senha */
      let r;try{const x=await fetch(CFG.supabaseUrl+'/functions/v1/alunos',{method:'POST',headers:{'Content-Type':'application/json',apikey:CFG.supabaseKey,Authorization:"Bearer "+CFG.supabaseKey},body:JSON.stringify({action:'claim',code:ST.code,email:em,password:pw})});r=await x.json()}catch(e){r={error:'Sem conexão. Tente de novo.'}}

      const {error}=await sb.auth.signInWithPassword({email:em,password:pw});$('#go').disabled=false;$('#go').textContent='Criar minha conta';

    if(!data.session){$('#er').textContent='Conta criada. Confirme pelo e-mail e depois entre.';return}

/* ---------- cadastro: uma pergunta por tela ---------- */
const STEPS0=['dados','nasc','medidas','obj','nivel','saude','local','dias','termos'];let STEPS=STEPS0.slice();
function frame(i,title,sub,body,btn='Continuar'){const n=STEPS.length;
  R.innerHTML=`<div class="scr"><div class="nav"><button class="bk" id="bk" ${i===0?'style="visibility:hidden"':''}>‹</button><span class="bar"><i style="width:${Math.round((i+1)/(n+1)*100)}%"></i></span><span>${i+1}/${n}</span><button class="sair" id="sair">Sair</button></div>
  <p class="q">${title}</p>${sub?`<p class="qs">${sub}</p>`:''}${body}<p class="err" id="er"></p><div class="cta"><button class="b1" id="go">${btn}</button></div></div>`;
  $('#bk').onclick=()=>step(i-1);$('#sair').onclick=async()=>{saveDraft();await sb.auth.signOut();toast('Seu progresso fica salvo. Entre de novo para continuar.');ST.user=null;welcome()};window.scrollTo(0,0)}
const err=t=>{$('#er').textContent=t};
function wheel(id,vals,sel,fmt=v=>v){return `<div class="wcol" id="${id}"><div class="pad"></div>${vals.map(v=>`<div data-v="${v}">${fmt(v)}</div>`).join('')}<div class="pad"></div></div>`}
function wheelInit(id,vals,sel){const c=$('#'+id);const i=Math.max(0,vals.indexOf(sel));c.scrollTop=i*52;const mark=()=>{const k=Math.round(c.scrollTop/52);c.querySelectorAll('[data-v]').forEach((d,j)=>d.classList.toggle('on',j===k))};mark();c.addEventListener('scroll',()=>requestAnimationFrame(mark));
  return ()=>vals[Math.min(vals.length-1,Math.max(0,Math.round(c.scrollTop/52)))]}
const range=(a,b)=>Array.from({length:b-a+1},(_,k)=>a+k);
const MES=['jan.','fev.','mar.','abr.','mai.','jun.','jul.','ago.','set.','out.','nov.','dez.'];
function step(i){if(i<0){return}const D=ST.d;ST.d.step=i;saveDraft();const k=STEPS[i];
 if(k==='dados'){frame(i,'Quase lá',`Confira seus dados. O documento é usado só para a cobrança e o recibo.`,
  `<span class="lb">Nome completo</span><input class="in" id="nm" value="${esc(D.name||'')}" autocomplete="name" placeholder="Seu nome">
  <span class="lb">Celular (WhatsApp)</span>${phoneHTML('ph',D.phone)}
  <div class="tg"><span>Sou estrangeiro(a), não tenho CPF</span><button class="sw${D.foreign?' on':''}" id="fo" aria-label="Sou estrangeiro"></button></div>
  <div id="docs"></div>`);
  const docs=()=>{$('#docs').innerHTML=D.foreign?`<span class="lb">Passaporte</span><input class="in" id="dn" value="${esc(D.doc||'')}" placeholder="Número do passaporte"><span class="lb">País</span><input class="in" id="ct" value="${esc(D.country||'')}" placeholder="Ex.: Argentina">`
   :`<span class="lb">CPF</span><input class="in" id="dn" value="${esc(D.doc||'')}" inputmode="numeric" placeholder="000.000.000-00">`;
   const dn=$('#dn');if(!D.foreign)dn.oninput=()=>{let v=dn.value.replace(/\D/g,'').slice(0,11);dn.value=v.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})\.(\d{3})(\d)/,'$1.$2.$3').replace(/(\d{3})\.(\d{3})\.(\d{3})(\d)/,'$1.$2.$3-$4')}};docs();
  const gp=phoneInit('ph');$('#fo').onclick=()=>{D.foreign=!D.foreign;$('#fo').classList.toggle('on',D.foreign);D.doc='';docs()};
  $('#go').onclick=()=>{D.name=$('#nm').value.trim();D.phone=gp();D.doc=$('#dn').value.trim();if(D.foreign)D.country=($('#ct').value||'').trim();
   if(D.name.split(' ').length<2)return err('Coloque nome e sobrenome.');if(!phoneOk(D.phone))return err('Confira o celular com DDD.');
   if(!D.foreign&&!cpfOk(D.doc))return err('Esse CPF não é válido. Confira os números.');if(D.foreign&&(!D.doc||!D.country))return err('Preencha passaporte e país.');step(i+1)}}
 else if(k==='nasc'){const dd=range(1,31),mm=range(0,11),yy=range(1940,2012);frame(i,'Quando você nasceu?','',
  `<div class="wheel" style="grid-template-columns:.8fr 1.2fr 1.2fr">${wheel('wd',dd)}${wheel('wm',mm,0,m=>MES[m])}${wheel('wy',yy)}</div>`);
  const b=(D.birth||'1995-06-15').split('-').map(Number);const gd=wheelInit('wd',dd,b[2]),gm=wheelInit('wm',mm,b[1]-1),gy=wheelInit('wy',yy,b[0]);
  $('#go').onclick=()=>{const y=gy(),m=gm(),d=gd();const dt=new Date(y,m,d);if(dt.getMonth()!==m)return err('Essa data não existe. Confira o dia.');D.birth=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;step(i+1)}}
 else if(k==='medidas'){const hs=range(130,215),ws=range(35,180);frame(i,'Altura e peso','Só para o '+PN+' acompanhar sua evolução. Você escolhe se mostra o peso.',
  `<div class="wheel" style="grid-template-columns:1fr 1fr">${wheel('wh',hs,0,v=>v+' cm')}${wheel('ww',ws,0,v=>v+' kg')}</div><div class="wlb" style="grid-template-columns:1fr 1fr"><span>altura</span><span>peso</span></div>`);
  const gh=wheelInit('wh',hs,D.height||170),gw=wheelInit('ww',ws,D.weight||70);$('#go').onclick=()=>{D.height=gh();D.weight=gw();step(i+1)}}
 else if(k==='obj'){frame(i,'Qual é o seu objetivo?','O '+PN+' usa isso para montar seu primeiro treino.',GOALS.map(g=>`<button class="opt${D.goal===g?' on':''}" data-g="${g}">${g}<span class="ck">✓</span></button>`).join(''));
  R.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{D.goal=b.dataset.g;R.querySelectorAll('[data-g]').forEach(x=>x.classList.toggle('on',x===b))});
  $('#go').onclick=()=>D.goal?step(i+1):err('Escolha um objetivo.')}
 else if(k==='nivel'){frame(i,'Qual é o seu nível hoje?','',LEVELS.map(([l,s])=>`<button class="opt${D.level===l?' on':''}" data-l="${l}"><span>${l}<small>${s}</small></span><span class="ck">✓</span></button>`).join(''));
  R.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{D.level=b.dataset.l;R.querySelectorAll('[data-l]').forEach(x=>x.classList.toggle('on',x===b))});
  $('#go').onclick=()=>D.level?step(i+1):err('Escolha seu nível.')}
 else if(k==='saude'){D.parq=D.parq||{};frame(i,'Sua saúde','Perguntas rápidas de segurança, antes da primeira aula.',
  `<span class="lb">Alguma lesão ou dor?</span><div class="seg" style="grid-template-columns:1fr 1fr"><button data-in="0" class="${D.hasInj===false?'on':''}">Não</button><button data-in="1" class="${D.hasInj?'on':''}">Sim</button></div>
  <div id="inj" ${D.hasInj?'':'hidden'}><span class="lb">Conte onde e o que sente</span><textarea class="in" id="it" placeholder="Ex.: dor no joelho direito ao agachar">${esc(D.injury||'')}</textarea></div>
  <span class="lb">Responda sim ou não</span>${PARQ.map((q,j)=>`<div class="parq"><span>${q}</span><span class="yn"><button data-pq="${j}:0" class="${D.parq[j]===false?'on':''}">Não</button><button data-pq="${j}:1" class="${D.parq[j]===true?'on':''}">Sim</button></span></div>`).join('')}`);
  R.querySelectorAll('[data-in]').forEach(b=>b.onclick=()=>{D.hasInj=b.dataset.in==='1';R.querySelectorAll('[data-in]').forEach(x=>x.classList.toggle('on',x===b));$('#inj').hidden=!D.hasInj});
  R.querySelectorAll('[data-pq]').forEach(b=>b.onclick=()=>{const [j,v]=b.dataset.pq.split(':');D.parq[j]=v==='1';b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b))});
  $('#go').onclick=()=>{if(D.hasInj===undefined)return err('Responda se tem lesão ou dor.');if(D.hasInj){D.injury=$('#it').value.trim();if(!D.injury)return err('Conte rapidinho qual é a lesão ou dor.')}else D.injury='';
   if(PARQ.some((_,j)=>D.parq[j]===undefined))return err('Responda todas as perguntas.');step(i+1)}}
 else if(k==='local'){const all=[...LOCS,'__outro'];frame(i,'Onde?','Onde você quer treinar com o '+PN+'?',
  all.map(l=>l==='__outro'?`<button class="opt${D.loc==='__outro'?' on':''}" data-lc="__outro"><span>Outro local<small>Seu prédio, outra academia, ao ar livre…</small></span><span class="ck">✓</span></button>`:`<button class="opt${D.loc===l?' on':''}" data-lc="${l}">${l}<span class="ck">✓</span></button>`).join('')+
  `<div id="lo" ${D.loc==='__outro'?'':'hidden'}><span class="lb">Qual local?</span><input class="in" id="lt" value="${esc(D.locOther||'')}" placeholder="Ex.: academia do meu prédio, Barra"><div class="box y"><b>O ${PN} vê seu pedido e responde por aqui.</b>Ele confirma se dá para atender nesse local.</div></div>`);
  R.querySelectorAll('[data-lc]').forEach(b=>b.onclick=()=>{D.loc=b.dataset.lc;R.querySelectorAll('[data-lc]').forEach(x=>x.classList.toggle('on',x===b));$('#lo').hidden=D.loc!=='__outro'});
  $('#go').onclick=()=>{if(!D.loc)return err('Escolha o local.');if(D.loc==='__outro'){D.locOther=$('#lt').value.trim();if(!D.locOther)return err('Escreva qual é o local.')}step(i+1)}}
 else if(k==='dias'){D.days=D.days||[];const offD=[0,1,2,3,4,5,6].filter(d=>!dayOk(d)),offTxt=offD.length?(offD.length===1?DOWL[offD[0]]:offD.slice(0,-1).map(d=>DOWL[d]).join(', ')+' e '+DOWL[offD[offD.length-1]]):'';
  frame(i,'Quando você quer treinar?','Só aparecem os dias e horários em que o '+PN+' atende.',
  `<span class="lb">Dias</span><div class="days">${DOWS.map((d,j)=>`<button data-dw="${j}" class="${D.days.includes(j)?'on':''}${dayOk(j)||D.days.includes(j)?'':' off'}" aria-label="${DOWL[j]}">${d}</button>`).join('')}</div>
  ${offTxt?`<p class="qs" style="margin:8px 0 0;font-size:13px">${offTxt[0].toUpperCase()+offTxt.slice(1)}: o ${PN} não atende.</p>`:''}
  <span class="lb">Período</span><div class="seg" style="grid-template-columns:repeat(3,1fr)" id="prs"></div>
  <span class="lb">Horário ideal (opcional)</span><input class="in" id="ih" value="${esc(D.ideal||'')}" placeholder="Ex.: por volta das 11h">
  <div id="spc"></div><div id="pl"></div>`);
  const pl=()=>{const n=D.days.length,v=mens(n);$('#pl').innerHTML=n?`<div class="plan"><span><small>${n}x por semana${v?' • '+brl(v.a)+' por aula':''}</small><b>${v?v.q:n*4} aulas por mês</b></span><span style="font-weight:800">${v?brl(v.m)+'/mês':'valor a combinar'}</span></div>`:''};
  const sp=()=>{$('#spc').innerHTML=D.note?`<div class="spc"><b>Seu pedido especial:</b> ${esc(D.note)}</div>`:''};
  const prs=()=>{$('#prs').innerHTML=PERIODS.map(([k2,l,s2])=>{const ok=perOk(k2,D.days)||D.period===k2;return `<button data-pr="${k2}" class="${D.period===k2?'on':''}${ok?'':' off'}">${l}<small>${ok?s2:'não atende'}</small></button>`}).join('');
    R.querySelectorAll('[data-pr]').forEach(b=>b.onclick=()=>{const p=b.dataset.pr,lbl=PERIODS.find(x=>x[0]===p)[1].toLowerCase();
      const pick=()=>{D.period=p;prs()};if(!b.classList.contains('off'))return pick();
      askSheet(`O ${PN} não atende à ${lbl} nesses dias. Quer pedir mesmo assim?`,'Ex.: Só consigo à '+lbl+', rola?',t=>{D.note=[D.note,t||('Pediu '+lbl)].filter(Boolean).join(' • ');pick();sp()})})};
  pl();prs();sp();
  R.querySelectorAll('[data-dw]').forEach(b=>b.onclick=()=>{const j=+b.dataset.dw,tog=()=>{D.days=D.days.includes(j)?D.days.filter(x=>x!==j):[...D.days,j].sort();b.classList.toggle('on');b.classList.remove('off');pl();prs()};
    if(D.days.includes(j)||dayOk(j))return tog();
    askSheet(`O ${PN} não atende ${DOWL[j]}. Quer pedir mesmo assim?`,`Ex.: Só consigo ${DOWL[j]} de manhã, rola?`,t=>{D.note=[D.note,t||('Pediu '+DOWL[j])].filter(Boolean).join(' • ');tog();sp()})});
  $('#go').onclick=()=>{D.ideal=$('#ih').value.trim();if(!D.days.length)return err('Escolha pelo menos um dia.');if(!D.period)return err('Escolha o período.');step(i+1)}}
 else if(k==='termos'){frame(i,'Combinado é combinado',ST.hasFx?'Último passo. Leia e aceite para entrar no app.':'Último passo. Leia e aceite para enviar seu pedido.',
  `<div class="box"><ol class="rules">${RULES.map(r=>`<li>${r}</li>`).join('')}</ol></div>
  <div class="tg"><span>Li e concordo com as regras</span><button class="sw${D.rules?' on':''}" id="t1" aria-label="Concordo com as regras"></button></div>
  <div class="tg"><span style="font-size:13.5px">Autorizo o uso dos meus dados de saúde para o meu treino. Só eu e o ${PN} vemos (LGPD).</span><button class="sw${D.lgpd?' on':''}" id="t2" aria-label="Autorizo"></button></div>`,ST.hasFx?'Entrar no app':'Enviar para o '+PN);
  $('#t1').onclick=()=>{D.rules=!D.rules;$('#t1').classList.toggle('on',D.rules)};$('#t2').onclick=()=>{D.lgpd=!D.lgpd;$('#t2').classList.toggle('on',D.lgpd)};
  $('#go').onclick=()=>{if(!D.rules||!D.lgpd)return err('Para enviar, aceite as regras e autorize os dados de saúde.');submit()}}}
function cpfOk(v){const c=String(v).replace(/\D/g,'');if(c.length!==11||/^(\d)\1+$/.test(c))return false;let s=0;for(let i=0;i<9;i++)s+=+c[i]*(10-i);let d=11-s%11;if(d>9)d=0;if(d!==+c[9])return false;s=0;for(let i=0;i<10;i++)s+=+c[i]*(11-i);d=11-s%11;if(d>9)d=0;return d===+c[10]}
async function submit(){const D=ST.d,b=$('#go');b.disabled=true;b.textContent='Enviando…';const now=new Date().toISOString();
  const up={name:D.name,phone:D.phone,doc_type:D.foreign?'passaporte':'cpf',doc_num:D.doc,country:D.foreign?D.country:'Brasil',birth_date:D.birth,height_cm:D.height,weight_kg:D.weight,goal:D.goal,level:D.level,injury:D.injury||null,parq:D.parq,consent_at:now,rules_ok_at:now,onboarded:true};if(!ST.hasFx){up.presencial=true;up.freq=(D.days||[]).length}
  let {error}=await sb.from('profiles').update(up).eq('id',ST.user.id);
  if(!error&&!ST.hasFx){const r=await sb.from('requests').insert({student_id:ST.user.id,location:D.loc==='__outro'?null:D.loc,location_other:D.loc==='__outro'?D.locOther:null,days:D.days,period:D.period,ideal_time:D.ideal||null,freq:D.days.length,monthly_price:(mens(D.days.length)||{}).m||null,note:D.note||null});error=r.error}
  if(error){b.disabled=false;b.textContent='Enviar para o '+PN;err('Não deu para enviar agora. Tente de novo. ('+error.message+')');return}
  try{localStorage.removeItem('cc_draft')}catch(_){}ST.d={};home(true)}

/* ---------- depois do pedido ---------- */
const fmtSlot=s=>`${DOWN[s.dow]} ${s.time}`;
async function home(fresh){R.innerHTML='<div class="ld">Carregando…</div>';try{await sb.rpc('expire_reservations')}catch(_){}
  const [{data:rq},{data:cl}]=await Promise.all([sb.from('requests').select('*,proposals(*)').eq('student_id',ST.user.id).order('created_at',{ascending:false}).limit(1),
    sb.from('classes').select('*').eq('student_id',ST.user.id).gte('starts_at',new Date(Date.now()-36e5).toISOString()).order('starts_at').limit(12)]);
  const r=rq&&rq[0],pr=r&&(r.proposals||[]).sort((a,b)=>b.created_at.localeCompare(a.created_at))[0],nm=(ST.prof&&ST.prof.name||'').split(' ')[0];
  if(r&&r.pay_status==='expirado'&&!(cl&&cl.some(c=>c.status!=='cancelada'))){R.innerHTML=`<div class="scr" style="text-align:center"><p class="q" style="margin-top:40px">Reserva expirou</p><p class="qs">O pagamento não foi confirmado a tempo e os horários foram liberados. Fale com o ${PN} para reservar de novo.</p>
    <div class="cta"><a class="b1" style="display:grid;place-items:center;text-decoration:none" href="https://wa.me/${WA_DUV}?text=${encodeURIComponent('Oi, '+PN+'! Minha reserva expirou, quero fechar meus horários.')}" target="_blank" rel="noopener">Falar com o ${PN}</a><button class="b2 nb" id="out">Sair da conta</button></div></div>`;$('#out').onclick=async()=>{await sb.auth.signOut();ST.user=null;welcome()};return}
  if(r&&(r.pay_status==='pendente'||r.pay_status==='informado')){const {data:pix}=await sb.rpc('public_pix');const rs=(cl||[]).filter(c=>c.status==='reservada'),inf=r.pay_status==='informado';
    const f2=t=>{const d=new Date(t);return `${DOWN[d.getDay()]}, ${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')} • ${d.getHours()}h${d.getMinutes()?String(d.getMinutes()).padStart(2,'0'):''}`};
    const due=r.pay_due?f2(r.pay_due):'';
    R.innerHTML=`<div class="scr"><div class="okc" style="margin:24px auto 12px">✓</div><p class="q" style="text-align:center;margin-top:0">Horário fechado!</p>
    <p class="qs" style="text-align:center">${inf?`Você avisou que pagou. O ${PN} confere e libera suas aulas.`:'Agora é só o pagamento. Suas aulas entram na agenda quando ele for confirmado.'}</p>
    ${rs.slice(0,3).map((c,k)=>`<div class="cls"><span><b>${f2(c.starts_at)}</b><small>${esc(c.location||'')}${k===0?' • primeira aula':''}</small></span><span class="st">reservada</span></div>`).join('')}
    <div class="plan" style="margin-top:12px"><span><small>${r.freq||r.days.length}x por semana • mensal</small><b>${r.pay_amount?brl(r.pay_amount):'valor a combinar'}</b></span>${due?`<span style="text-align:right;font-size:12px;color:var(--mu)">reserva até<br><b style="font-family:inherit;font-size:13px;color:var(--fg)">${due}</b></span>`:''}</div>
    ${pix&&!inf?`<span class="lb">PIX do ${PN}</span><div class="plan" style="margin-top:6px"><span style="word-break:break-all;font-size:13px;font-weight:700;min-width:0">${esc(pix)}</span><button id="cp" style="background:var(--fg);color:#1c1d20;flex:none;font-size:12.5px;font-weight:800;border-radius:9px;padding:9px 12px">Copiar</button></div>`:''}
    <label class="pf" id="pfl"><input type="file" id="pf" accept="image/*,application/pdf" hidden><span id="pft">${r.pay_proof?'✓ Comprovante enviado • trocar':'📎 Anexar comprovante <small>(opcional)</small>'}</span></label>
    <div style="height:${inf?150:210}px"></div><div class="cta">${inf?'':`<button class="b1" id="pg">Já paguei</button>`}<a class="b2" href="/app/aluno/" style="display:grid;place-items:center;text-decoration:none">Entrar no app</a><a class="b2 nb" style="display:grid;place-items:center;text-decoration:none" href="https://wa.me/${WA_DUV}?text=${encodeURIComponent('Oi, '+PN+'! Sobre o pagamento do meu plano:')}" target="_blank" rel="noopener">Falar com o ${PN}</a></div></div>`;
    const cp=$('#cp');if(cp)cp.onclick=async()=>{try{await navigator.clipboard.writeText(pix);toast('Chave PIX copiada')}catch(_){toast('Copie a chave: '+pix)}};
    let proof=null;$('#pf').onchange=async e=>{const fl=e.target.files[0];if(!fl)return;$('#pft').textContent='Enviando…';
      try{let blob=fl,ext=(fl.name.split('.').pop()||'jpg').toLowerCase();
        if(fl.type.startsWith('image/')){blob=await shrink(fl);ext='jpg'}else if(fl.size>2097152){$('#pft').textContent='PDF muito grande (máx. 2 MB)';return}
        const path=ST.user.id+'/'+Date.now()+'.'+ext;const {error}=await sb.storage.from('receipts').upload(path,blob,{contentType:ext==='jpg'?'image/jpeg':fl.type,upsert:false});if(error)throw error;
        proof=path;if(inf){await sb.rpc('inform_payment',{p_proof:path});toast('Comprovante enviado')}$('#pft').textContent='✓ Comprovante anexado';$('#pfl').classList.add('ok')}
      catch(er){$('#pft').textContent='Não deu para enviar. Tente de novo.';console.error(er)}};
    const pg=$('#pg');if(pg)pg.onclick=async()=>{pg.disabled=true;const {error}=await sb.rpc('inform_payment',proof?{p_proof:proof}:{});if(error){pg.disabled=false;return toast('Não deu: '+error.message)}toast('Avisamos o '+PN);home()};return}
  if(cl&&cl.length){location.replace('/app/aluno/');return;const f=t=>{const d=new Date(t);return `${DOWN[d.getDay()]} ${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')} • ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`};
    R.innerHTML=`<div class="scr"><span class="br" style="font-size:12px;letter-spacing:4px;font-weight:700;color:#cfcfc9">CHAMES CREW</span><p class="q">Suas aulas</p><p class="qs">${nm?esc(nm)+', seus':'Seus'} horários com o ${PN} estão marcados. A agenda completa do app chega na próxima atualização do teste.</p>
    ${(()=>{const nx=cl.find(c=>c.status!=='cancelada');return cl.map(c=>`<div class="cls"><span><b>${f(c.starts_at)}</b><small>${esc(c.location||'')}${c===nx?' • próxima aula':''}</small></span>${c.status==='confirmada'?'<span class="st ok">confirmada</span>':c.status==='cancelada'?'<span class="st">cancelada</span>':c===nx?`<button class="st" style="background:var(--fg);color:#1c1d20" data-cf="${c.id}">Confirmar</button>`:'<span class="st">marcada</span>'}</div>`).join('')})()}
    <div class="cta"><button class="b2 nb" id="out">Sair da conta</button></div></div>`;
    R.querySelectorAll('[data-cf]').forEach(b=>b.onclick=async()=>{const {error}=await sb.from('classes').update({status:'confirmada'}).eq('id',b.dataset.cf);if(error)toast('Não deu: '+error.message);else{toast('Presença confirmada');home()}});
    $('#out').onclick=async()=>{await sb.auth.signOut();ST.user=null;welcome()};return}
  if(pr&&pr.status==='enviada'){const sl=pr.slots||[];
    R.innerHTML=`<div class="scr"><div class="box g" style="margin-top:20px"><b>O ${PN} respondeu seu pedido</b></div>
    <div class="pro"><span style="font-size:12.5px;color:var(--mu);font-weight:700">Proposta de horário</span><p class="big">${sl.map(fmtSlot).join(' • ')}</p>
    <p class="qs">${esc(sl[0]&&sl[0].location||r.location||r.location_other||'')} • com ${PN}${pr.start_date?' • começa '+pr.start_date.split('-').reverse().slice(0,2).join('/'):''}</p>${pr.message?`<div class="msg">“${esc(pr.message)}”</div>`:''}</div>
    <p class="err" id="er"></p><div class="cta"><button class="b1" id="ac">Aceitar horário</button><button class="b2" id="tk">Mandar mensagem</button><button class="b2 nb" id="out">Sair da conta</button></div></div>`;$('#out').onclick=async()=>{await sb.auth.signOut();ST.user=null;welcome()};
    $('#ac').onclick=async()=>{$('#ac').disabled=true;const {error}=await sb.rpc('accept_proposal',{p_id:pr.id});if(error){$('#ac').disabled=false;return err('Não deu para aceitar: '+error.message)}toast('Horário fechado!');home()};
    $('#tk').onclick=async()=>{await sb.rpc('talk_proposal',{p_id:pr.id});location.href=`https://wa.me/${WA_DUV}?text=${encodeURIComponent('Oi, '+PN+'! Sobre a proposta de horário: ')}`};return}
  const st=r?r.status:'aguardando';
  R.innerHTML=`<div class="scr" style="text-align:center"><div class="okc">✓</div><p class="q" style="margin-top:0">${fresh?'Pedido enviado!':'Pedido com o '+PN}</p>
  <p class="qs" style="padding:0 10px">${st==='recusado'?`O ${PN} não conseguiu atender esse pedido. Fale com ele para ver outra opção.`:st==='conversar'?`Você pediu para conversar sobre o horário. O ${PN} vai te chamar.`:`O ${PN} recebe agora e responde por aqui. Você é avisado quando ele mandar a proposta de horário.`}</p>
  <div class="nx" style="text-align:left"><div class="on"><i>1</i>O ${PN} manda a proposta de horário<small>${st==='aguardando'?'aguardando':''}</small></div><div><i>2</i>Você aceita e as aulas entram na agenda</div><div><i>3</i>Pagamento e anamnese completa<small>em breve</small></div></div>
  <div class="cta"><button class="b1" id="rf">Atualizar</button><a class="b2" style="display:grid;place-items:center;text-decoration:none" href="https://wa.me/${WA_DUV}?text=${encodeURIComponent('Oi, '+PN+'! Acabei de mandar meu pedido pelo app.')}" target="_blank" rel="noopener">Falar com o ${PN}</a><button class="b2 nb" id="out">Sair da conta</button></div></div>`;
  $('#rf').onclick=()=>home();$('#out').onclick=async()=>{await sb.auth.signOut();ST.user=null;welcome()}}

/* ---------- rota ---------- */
async function route(){const {data:{session}}=await sb.auth.getSession();if(!session){ST.code?openInvite():welcome();return}
  ST.user=session.user;const {data:p}=await sb.from('profiles').select('*').eq('id',ST.user.id).single();ST.prof=p||{};
  if(p&&p.role==='equipe'){location.replace('/app/personal/');return}
  if(!p||!p.onboarded){if(!ST.d.name&&p){ST.d.name=p.name||'';ST.d.phone=p.phone||''}
    const [{data:fx},{data:lc},{data:pz},{data:wh}]=await Promise.all([sb.from('fixed_slots').select('id').eq('student_id',ST.user.id).limit(1),sb.rpc('public_locs'),sb.rpc('public_prices'),sb.rpc('public_wh')]);PRICE=pz||{};WHD=wh||{};
    LOCS=(lc||[]).filter(Boolean);ST.hasFx=!!(fx&&fx.length);STEPS=ST.hasFx?STEPS0.filter(k=>k!=='local'&&k!=='dias'):STEPS0.slice();step(Math.min(ST.d.step||0,STEPS.length-1));return}
  home()}
(async()=>{if(/[?&]sair\b/.test(location.search)){try{await sb.auth.signOut()}catch(_){}history.replaceState(null,'','/app/')}route()})();
</script></body></html>
