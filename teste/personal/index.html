<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Chames Personal">
<meta name="robots" content="noindex"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icone-180.png"><link rel="icon" href="icone-180.png">
</head><body>
<meta charset="utf-8">
<title>App do personal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Manrope:wght@500;700;800&display=swap">
<style>
/* Layout: app de uma tela. Topo com dias, próximo aluno em destaque, avisos, linha do tempo do dia; barra principal fixa embaixo */
:root{
  --bg:#eceef2;--fg:#0b0b0d;--muted:#62646c;--line:#dfe1e6;--frost:#eef0f3;--bz1:#e6e8ed;--bz2:#c3c7cf;--card:#ffffff;--sec:#f6f7f9;--shadow:0 1px 2px rgba(15,17,22,.06),0 4px 14px rgba(15,17,22,.04);
  --ok:#16794a;--okbg:#e0f2e8;--warn:#a45a00;--warnbg:#fbeedb;--bad:#b42318;--badbg:#fbe4e1;--gcal:#3d6bd6;--gcalbg:#e3eafb;
  --glass:rgba(255,255,255,.75);--okfill:#22894f;--conf:#ffffff;--conftx:#0b0b0d;--yel:#c99a06;--yelbg:#fdf3cf;--yeltx:#6b5200;--acc:#0b0b0d;--accfg:#ffffff;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;--body:"Manrope",system-ui,-apple-system,sans-serif;
  color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000000;--fg:#f4f4f6;--muted:#a1a3ab;--line:#2c2d34;--frost:#1f2026;--bz1:#3b3e48;--bz2:#1d1f25;--card:#141519;--sec:#1a1b20;--ok:#6fd39c;--okbg:#10251a;--warn:#f0b65c;--warnbg:#2a1f0e;--bad:#f28b7e;--badbg:#2c1311;--gcal:#8eaaf0;--gcalbg:#131b2e;--glass:rgba(20,21,24,.75);--okfill:#2f9e62;--conf:#f4f4f6;--conftx:#0b0b0d;--yel:#e4b93a;--yelbg:#2b2410;--yeltx:#f0cf6a;--acc:#f4f4f6;--accfg:#0b0b0d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000000;--fg:#f4f4f6;--muted:#a1a3ab;--line:#2c2d34;--frost:#1f2026;--bz1:#3b3e48;--bz2:#1d1f25;--card:#141519;--sec:#1a1b20;--ok:#6fd39c;--okbg:#10251a;--warn:#f0b65c;--warnbg:#2a1f0e;--bad:#f28b7e;--badbg:#2c1311;--gcal:#8eaaf0;--gcalbg:#131b2e;--glass:rgba(20,21,24,.75);--okfill:#2f9e62;--conf:#f4f4f6;--conftx:#0b0b0d;--yel:#e4b93a;--yelbg:#2b2410;--yeltx:#f0cf6a;--acc:#f4f4f6;--accfg:#0b0b0d;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;display:flex;flex-direction:column;overflow:hidden;position:relative}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.scroller{flex:1;min-height:0;overflow-y:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 24px}
.dock{flex:none}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.d{font-family:var(--display);font-weight:900;text-transform:uppercase;line-height:1}
.lbl{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin:0}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.card{border:1px solid var(--line);border-radius:20px;background:var(--card);padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow,none)}
.card>.lbl:first-child,.card>.row:first-child>.lbl{color:var(--fg);font-size:11.5px;opacity:.92}
.card>.lbl:first-child,.card>.row:first-child{padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:2px}
.top h1{font-size:34px;margin:0}
.add{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:999px;background:var(--fg);color:var(--bg);font-weight:800;font-size:14px;flex:none}
/* dias */
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dy{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;border-radius:14px}
.dy small{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase}
.dy b{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.dy i{width:5px;height:5px;border-radius:50%;background:var(--muted);opacity:.6}
.dy i.no{opacity:0}
.dy[aria-pressed="true"]{background:var(--fg);color:var(--bg)}.dy[aria-pressed="true"] small{color:var(--bg);opacity:.7}.dy[aria-pressed="true"] i{background:var(--bg)}
/* próximo aluno */
.next{background:var(--fg);color:var(--bg);border:0}
.next .lbl{color:var(--bg);opacity:.65}
.next h2{font-size:40px;margin:2px 0 0}
.next .when{font-weight:800;font-size:15px;opacity:.85}
.next .acts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.next .acts button,.next .acts a{padding:10px 4px;border-radius:12px;background:rgba(127,127,127,.22);font-weight:800;font-size:13px;text-align:center;color:inherit;text-decoration:none}
.next .acts .pres{background:var(--bg);color:var(--fg)}
.cnt{font-variant-numeric:tabular-nums;font-weight:800;font-size:13px;padding:5px 10px;border-radius:999px;background:rgba(127,127,127,.25)}
/* avisos */
.av{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.av:first-of-type{border-top:0}
.av b{font-weight:800;font-size:14px}
.av small{display:block;color:var(--muted);font-size:12.5px;font-weight:600}
.av q{display:block;font-size:13px;font-weight:700;margin-top:3px;quotes:"“" "”"}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;margin-right:4px;vertical-align:1px}
.t-pau{background:var(--frost);color:var(--fg);border:1px solid var(--line)}.t-can{background:var(--badbg);color:var(--bad)}.t-rem{background:var(--warnbg);color:var(--warn)}.t-new{background:var(--okbg);color:var(--ok)}
.seen{font-size:12.5px;font-weight:800;padding:7px 11px;border-radius:999px;background:var(--frost)}
/* linha do tempo */
.tl{display:flex;flex-direction:column}
.sl{display:grid;grid-template-columns:48px minmax(0,1fr);gap:10px;align-items:stretch;min-height:52px}
.sl .h{font-size:12.5px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:12px;text-align:right}
.sl .b{border-top:1px solid var(--line);padding:6px 0}
.ev{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:10px 12px;border-radius:12px;text-align:left;border:1px solid var(--line);background:var(--card)}
.ev b{display:block;font-weight:800;font-size:14.5px}
.ev small{display:block;font-size:12.5px;color:var(--muted);font-weight:600}
.ev .st{font-size:11.5px;font-weight:800;padding:4px 9px;border-radius:999px;white-space:nowrap}
.st.conf{background:var(--frost)}.st.ok{background:var(--okbg);color:var(--ok)}.st.wait{background:var(--warnbg);color:var(--warn)}.st.can{background:var(--badbg);color:var(--bad)}
.ev.done{background:var(--okfill);border-color:var(--okfill);color:#fff}.ev.done small{color:#fff;opacity:.85}.ev.done .st{background:rgba(255,255,255,.22);color:#fff}
.ev.waitc{background:var(--yelbg);border-color:var(--yel)}.ev.can{background:var(--badbg);border-color:transparent}.ev.can b{color:var(--bad)}
.ev.can b{text-decoration:line-through}
.ev.gc{background:var(--gcalbg);border-color:transparent;color:var(--gcal)}.ev.gc small{color:var(--gcal);opacity:.8}
.free{width:100%;padding:10px 12px;border-radius:12px;border:1px dashed var(--line);font-size:13px;font-weight:800;color:var(--muted);text-align:left;display:flex;justify-content:space-between}
.freed,.req,.lock{display:flex;flex-direction:column;gap:8px;padding:10px 12px;border-radius:12px}.lock{flex-direction:row;align-items:center;justify-content:space-between}
.freed{border:1.5px dashed var(--muted);background:transparent}.freed b{color:var(--fg)}.freed small{color:var(--muted)}
.req{border:1.5px solid var(--warn);background:var(--warnbg)}.req b,.req small{color:var(--warn)}
.lock{background:var(--frost);border:1px solid var(--line)}
.freed b,.req b,.lock b{display:block;font-weight:800;font-size:14px}.freed small,.req small,.lock small{display:block;font-size:12.5px;font-weight:600;opacity:.85}
.lock small{color:var(--muted)}
.rb{display:flex;gap:6px;flex-wrap:wrap}
.mini{font-size:12.5px;font-weight:800;padding:7px 11px;border-radius:999px;background:var(--card);border:1px solid var(--line);white-space:nowrap}
.mini.solid{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.t-req{background:var(--warnbg);color:var(--warn)}
.sim{font-size:11.5px;font-weight:700;color:var(--muted);text-decoration:underline;padding:4px 2px}
.now{position:relative;height:0;border-top:2px solid var(--bad);margin:0 0 0 58px}
.now::before{content:"";position:absolute;left:-5px;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;font-weight:700;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
/* barra principal */
.tabs{padding:6px max(12px,env(safe-area-inset-right,0px)) 4px max(12px,env(safe-area-inset-left,0px))}
.tabs nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);padding:5px;border-radius:22px;background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--line)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:16px;font-size:11.5px;font-weight:800;color:var(--muted);position:relative}
.tabs button svg{width:20px;height:20px}
.tabs button[aria-current="page"]{background:var(--fg);color:var(--bg)}
.tabs .bd{position:absolute;top:2px;right:calc(50% - 20px);min-width:17px;height:17px;border-radius:9px;background:var(--bad);color:#fff;font-size:10.5px;display:grid;place-items:center;padding:0 4px}
/* folhas */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:40}
.sheet{width:100%;max-width:560px;max-height:88%;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:20px max(18px,env(safe-area-inset-right,0px)) 20px max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.sheet h3{font-size:30px;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:8px 12px;border-radius:999px;border:1px solid var(--line);font-weight:800;font-size:13px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.inp{width:100%;padding:12px 13px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;font-weight:700}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{padding:13px;border-radius:12px;border:1px solid var(--line);font-weight:800;text-align:center;font-size:14px}
.btn.solid{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.who{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px;border-radius:14px;border:1px solid var(--line);text-align:left;background:var(--sec)}
.who[aria-pressed="true"]{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg)}
.av0{width:36px;height:36px;border-radius:50%;background:var(--frost);display:grid;place-items:center;font-weight:800;font-size:13px}
.who b{display:block;font-weight:800;font-size:14px}.who small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.quota{font-size:12px;font-weight:800;color:var(--muted);white-space:nowrap}
.quota.full{color:var(--warn)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;border-radius:12px;background:var(--frost);font-weight:700;font-size:14px}
.sw input{width:44px;height:26px;accent-color:var(--fg)}
.info{padding:10px 12px;border-radius:12px;font-size:13px;font-weight:700}
.info.ok{background:var(--okbg);color:var(--ok)}.info.warn{background:var(--warnbg);color:var(--warn)}
.msg{padding:12px 14px;border-radius:14px 14px 14px 4px;background:var(--okbg);font-size:14px;font-weight:600;line-height:1.45}
.brand{display:flex;align-items:center;gap:10px}.brand b{flex:1;min-width:0;font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg{border-radius:10px;object-fit:cover;flex:none;display:inline-grid;place-items:center}.lg.ph{background:var(--fg);color:var(--bg);font-weight:900}
.gear{width:38px;height:38px;border-radius:50%;background:var(--frost);display:grid;place-items:center}
.lgrow{display:flex;align-items:center;gap:12px}
.lcard{display:grid;grid-template-columns:42px minmax(0,1fr);gap:10px;align-items:center;margin-top:10px;padding:8px;border-radius:10px;background:var(--card);color:var(--fg)}.lcard b{display:block;font-size:13.5px}.lcard small{display:block;font-size:11.5px;color:var(--muted);font-weight:600}
.back{width:38px;height:38px;border-radius:50%;background:var(--frost);display:grid;place-items:center;font-size:22px;font-weight:800;flex:none}
.bdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.bd2{display:flex;flex-direction:column;align-items:center;gap:5px;padding:4px 0}.bd2 small{font-size:11px;font-weight:800;color:var(--muted)}
.bd2 span{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:16px;border:1.5px dashed var(--line);color:var(--muted)}
.bd2.tr span{background:var(--fg);color:var(--bg);border:0}.bd2.cd span{border:1.5px solid var(--fg);color:var(--fg)}
.plans{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}.plans::-webkit-scrollbar{display:none}
.pl{flex:none;display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;border:1px solid var(--line);font-weight:800;font-size:13.5px;white-space:nowrap}
.pl i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--frost);font-weight:900}
.pl[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}.pl[aria-pressed="true"] i{background:var(--bg);color:var(--fg)}
.pl.add{padding:6px 12px;border-style:dashed;color:var(--muted)}
.xx{width:28px;height:28px;border-radius:50%;background:var(--frost);font-weight:800;color:var(--muted)}
.ex2{width:100%;display:grid;grid-template-columns:30px 34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 4px 11px 0;text-align:left}
.ex2 .num{width:30px;height:30px;border-radius:9px;background:var(--frost);display:grid;place-items:center;font-weight:900;font-size:12.5px}
.ex2.lk .num{background:var(--acc);color:var(--accfg)}
.ex2 b{display:block;font-weight:800;font-size:14.5px}.ex2 small{display:block;color:var(--muted);font-size:12.5px;font-weight:600}.ex2 .go{font-size:12px;font-weight:800;color:var(--muted)}
.tg{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}.tg em{font-style:normal;font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px;background:var(--frost)}
.lkbar{font-size:11.5px;font-weight:800;color:var(--muted);padding:2px 0 0 40px}
.acts2{display:flex;flex-wrap:wrap;gap:6px}.mini.favon{color:#d39b14}
.sum2{font-size:13px;font-weight:700;margin:0}.sum2 b{font-weight:800}
.clist{display:flex;flex-direction:column;gap:6px}
.cl{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--frost);text-align:left}
.cl .cc{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--fg);display:grid;place-items:center;font-size:13px}
.cl b{display:block;font-size:13.5px;font-weight:800}.cl small{display:block;font-size:12px;color:var(--muted);font-weight:600}.cl .go{font-size:12px;font-weight:800;color:var(--muted)}
.mode{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:10px;border-top:1px solid var(--line)}.mode>span{font-size:13px;font-weight:700;color:var(--muted)}
.seg{display:inline-grid;grid-template-columns:1fr 1fr;gap:2px;padding:3px;border-radius:10px;background:var(--frost)}.seg button{padding:6px 10px;border-radius:8px;font-weight:800;font-size:12.5px}
.opt2{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--sec);text-align:left}.opt2 b{font-weight:800;font-size:14.5px}.opt2 small{font-size:12.5px;color:var(--muted);font-weight:600}
.opt2.main{border:2px solid var(--acc)}.opt2.main b{font-size:16px}
.minor{display:flex;flex-direction:column;gap:2px}.minor button{text-align:left;padding:8px 2px;font-size:13.5px;font-weight:700;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.stick{position:sticky;bottom:-20px;margin:0 -18px -20px;padding:12px 18px 16px;background:linear-gradient(transparent,var(--bg) 30%);z-index:3}
.stick .btn{width:100%;box-shadow:0 10px 24px -10px rgba(0,0,0,.5)}
.prog{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:12px;background:var(--frost)}.prog b{font-weight:800}
.pex{margin:0;font-size:12.5px;font-weight:600;color:var(--muted)}.pex b{color:var(--ok)}
.prow3{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;font-size:13.5px;font-weight:700}
.ex2w{border-bottom:1px solid var(--line);display:grid;grid-template-columns:22px minmax(0,1fr);align-items:center;border-radius:14px;background:var(--card);touch-action:pan-y}
.ex2w{position:relative;overflow:hidden;display:block!important}
.swc{position:relative;z-index:1;display:grid;grid-template-columns:22px minmax(0,1fr);align-items:center;background:var(--card);transition:transform .22s cubic-bezier(.2,.9,.25,1)}
.ex2w.swiping .swc{transition:none}
.trash{position:absolute;right:0;top:0;bottom:0;width:92px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:#d64535;color:#fff;font-size:11.5px;font-weight:800}
.dragging .trash,.sorting .trash{display:none}
.cbox{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.5);display:grid;place-items:center;padding:24px}
.cin{width:100%;max-width:330px;background:var(--bg);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:8px;text-align:center;box-shadow:0 30px 60px -20px rgba(0,0,0,.6)}
.cin>b{font-size:18px;font-weight:800}.cin p{margin:0 0 8px;color:var(--muted);font-size:14.5px}.cin p b{color:var(--fg)}
.solidbad{background:#d64535!important;color:#fff!important;border-color:#d64535!important}
.ex2w,.ex2w *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.lk-wait{outline:2px dashed #3fbf7f;outline-offset:2px}
.dragging.settle{transition:transform .18s cubic-bezier(.2,.9,.25,1)!important}
.dh{font-size:16px;color:var(--muted);cursor:grab;touch-action:none;user-select:none;padding:12px 0;text-align:center}
.lkbar{padding:0 0 0 22px}.lkbar button{font-size:11.5px;font-weight:800;color:var(--ok);padding:4px 0}

<script>
// exemplo fixo: hoje é quinta, 30/out, 14:45
const NOW=14.75;
const WD=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'],DATES=[27,28,29,30,31,1,2],TODAY=3;
const STU=[{n:'Ana Souza',q:[5,8],ph:'21987654321'},{n:'Bruno Reis',q:[7,8]},{n:'Carla Mota',q:[8,8]},{n:'Duda Alves',q:[3,8]},{n:'João Prado',q:[2,4]},{n:'Pedro Lima',q:[9,12]},{n:'Lia Torres',q:[4,8]},{n:'Rafa Costa',q:[6,8]}];
const S={tab:'agenda',view:'dia',day:TODAY,
  ev:{3:[{h:7,n:'Pedro Lima',st:'ok'},{h:8,n:'Lia Torres',st:'ok'},{h:9.5,gc:'Consulta nutri'},{h:12,n:'Duda Alves',st:'ok'},{h:16,n:'Ana Souza',st:'conf'},{h:17,n:'Bruno Reis',st:'wait'},{h:18,n:'Carla Mota',st:'can',why:'Trabalho'},{h:19,n:'Rafa Costa',st:'conf'},{h:20,n:'Lia Torres',st:'can',why:'Viagem'}],
      4:[{h:7,n:'Pedro Lima',st:'conf'},{h:9,n:'Ana Souza',st:'conf'},{h:18,n:'Carla Mota',st:'conf',moved:true}],5:[{h:9,n:'Duda Alves',st:'conf'},{h:10,gc:'Aniversário da mãe'}],0:[{h:7,n:'Pedro Lima',st:'ok'}],1:[{h:8,n:'Lia Torres',st:'ok'}],2:[{h:18,n:'Ana Souza',st:'ok'}]},
  sp:{3:{18:{freed:'Carla Mota',req:{n:'João Prado',when:'há 20 min',tp:'extra'}},20:{freed:'Lia Torres'}}},
  av:[{t:'can',n:'Lia Torres',txt:'Cancelou hoje 20:00',why:'Vou viajar amanhã cedo',when:'há 40 min',seen:false,d:3,h:20},{t:'can',n:'Carla Mota',txt:'Cancelou hoje 18:00',why:'Reunião que não dá pra remarcar, desculpa!',when:'há 2h',seen:false},
      {t:'rem',n:'Carla Mota',txt:'Remarcou para sexta 18:00',why:'',when:'há 2h',seen:false},
      {t:'new',n:'Duda Alves',txt:'Marcou sábado 09:00 pelo app',why:'',when:'ontem',seen:false}]};
const LEG=`<div class="legend"><span><i style="background:var(--okfill)"></i>dada</span><span><i style="background:var(--conf);border:1px solid var(--muted)"></i>marcada</span><span><i style="background:var(--yelbg);border:1px solid var(--yel)"></i>falta confirmar</span><span><i style="background:#fff1c2;border:1px solid #e7b928"></i>alguém quer entrar</span><span><i style="background:#ece4ff;border:1px solid #8b5cf6"></i>experimental</span><span><i style="background:var(--badbg)"></i>cancelou</span><span><i style="border:1px dashed var(--muted)"></i>livre</span><span><i class="lgk"></i>bloqueado</span><span><i style="background:var(--gcalbg)"></i>Google</span></div>`;
const spOf=(d,h)=>(S.sp[d]||{})[h];
const HOURS=[];for(let h=6;h<=21;h++)HOURS.push(h);
const app=document.getElementById('app');
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hh=h=>{const m=Math.round(h*60);return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
const ini=n=>n.split(' ').map(x=>x[0]).join('').slice(0,2);
let stu=n=>STU.find(s=>s.n===n);
const ST={conf:['conf','Confirmado'],ok:['ok','Aula dada ✓'],wait:['wait','Falta confirmar'],can:['can','Cancelou']};
function dayLbl(i){return i===TODAY?'Hoje':i===TODAY+1?'Amanhã':WD[i]+' '+DATES[i]}
function upList(){if(S.day!==TODAY)return [];return (S.ev[TODAY]||[]).filter(e=>!e.gc&&(e.st!=='can'||(spOf(TODAY,Math.floor(e.h))&&!spOf(TODAY,Math.floor(e.h)).lock))&&(e.h>=NOW-.5||e.keep)).sort((a,b)=>a.h-b.h)}
const canInfo=e=>{const sp=spOf(S.day,Math.floor(e.h))||{};return `<div class="nxb"><span class="stb can">Cancelou</span><span>${esc(e.why||'sem motivo')}</span></div>${sp.req?`<div class="nreq"><b>${esc(sp.req.n)} quer este horário ${RQT(sp.req)}</b><small>pedido ${sp.req.when} • ${RQS(sp.req)}</small></div>`:'<div class="nreq"><b>Horário liberado</b><small>Aberto para os alunos marcarem</small></div>'}`};
const canActs=e=>{const h=Math.floor(e.h),sp=spOf(S.day,h)||{};return sp.req?`<div class="acts2c"><button class="go1" data-ok="${S.day}:${h}">Deixar ${esc(sp.req.n.split(' ')[0])} entrar${sp.req.tp==='extra'?' • +'+brl(PRICE.avulsa):''}</button><button data-lock="${h}">Travar</button></div>`:`<div class="acts2c"><button data-lock="${h}">Travar</button><button class="go1" data-free="${h}">+ Marcar alguém</button></div>`};
function nextUp(){const L=upList();if(!L.length)return null;S.nxi=Math.max(0,Math.min(L.length-1,S.nxi||0));return L[S.nxi]}
const WH={0:[[7,14]],1:[[7,10],[12,18]],2:[[7,12],[16,20]],3:[[7,13],[16,21]],4:[[7,12],[16,20]],5:[[8,12]],6:[]},BOOK={ante:2,ahead:14};
const isWork=(d,h)=>WH[d].some(([a,b])=>h>=a&&h<b);
const whTxt=d=>WH[d].length?WH[d].map(([a,b])=>`${a}h às ${b}h`).join(' e '):'não atende';
function whSheet(){let W=JSON.parse(JSON.stringify(WH)),B={...BOOK};const HS=[];for(let h=5;h<=23;h++)HS.push(h);
  const sel=(d,k,j,v)=>`<select class="inp sel wsel" data-wd="${d}:${k}:${j}">${HS.map(h=>`<option value="${h}"${h===v?' selected':''}>${String(h).padStart(2,'0')}:00</option>`).join('')}</select>`;
  const body=()=>`${DLONG.map((n,d)=>`<div class="whd"><label class="sw" style="padding:0;background:none"><span><b>${n[0].toUpperCase()+n.slice(1)}</b></span><input type="checkbox" data-won="${d}" ${W[d].length?'checked':''}></label>
      ${W[d].map((r,k)=>`<div class="whr">${sel(d,k,0,r[0])}<span>até</span>${sel(d,k,1,r[1])}<button class="xb" data-wdel="${d}:${k}" aria-label="Tirar intervalo">×</button></div>`).join('')}
      ${W[d].length?`<button class="lnk" data-wadd="${d}">+ outro intervalo</button>`:'<small class="note">Folga: ninguém marca</small>'}</div>`).join('')}
    <button class="mini" data-wcopy>Copiar a segunda para os dias úteis</button>
    <span class="lbl">Regras para o aluno marcar</span>
    <span class="note" style="margin:0">Antecedência mínima</span><div class="chips">${[1,2,6,12,24].map(k=>`<button class="chip" data-wa="${k}" aria-pressed="${B.ante===k}">${k}h</button>`).join('')}</div>
    <span class="note" style="margin:0">Até quantos dias à frente</span><div class="chips">${[7,14,30].map(k=>`<button class="chip" data-wh2="${k}" aria-pressed="${B.ahead===k}">${k} dias</button>`).join('')}</div>
    <div class="info ok">O aluno só vê e marca horários dentro desses intervalos, com ${B.ante}h de antecedência e até ${B.ahead} dias à frente. Conforme marcam, o horário some para os outros. Você continua podendo marcar na mão qualquer horário.</div>`;
  sheet(`<span class="lbl">Agenda</span><h3 class="d">Meus horários de atendimento</h3><div id="whb" style="display:flex;flex-direction:column;gap:10px">${body()}</div>
    <div class="row2"><button class="btn" data-close>Voltar</button><button class="btn solid" id="whok">Salvar</button></div>`,s=>{const re=()=>s.querySelector('#whb').innerHTML=body();
    s.addEventListener('change',e=>{const t=e.target;if(t.dataset.won!==undefined){const d=+t.dataset.won;W[d]=t.checked?[[7,12]]:[];re()}if(t.dataset.wd){const [d,k,j]=t.dataset.wd.split(':').map(Number);W[d][k][j]=+t.value;if(W[d][k][1]<=W[d][k][0]){W[d][k][1]=W[d][k][0]+1;toast('O fim tem que ser depois do início')}re()}});
    s.addEventListener('click',e=>{const b=e.target.closest('[data-wadd],[data-wdel],[data-wcopy],[data-wa],[data-wh2]');if(!b)return;const a=b.dataset;
      if(a.wadd!==undefined){const d=+a.wadd,l=W[d][W[d].length-1];const st=Math.min(22,l?l[1]+1:7);W[d].push([st,Math.min(23,st+3)])}
      if(a.wdel){const [d,k]=a.wdel.split(':').map(Number);W[d].splice(k,1)}
      if(a.wcopy!==undefined){[1,2,3,4].forEach(d=>W[d]=JSON.parse(JSON.stringify(W[0])));toast('Terça a sexta iguais à segunda')}
      if(a.wa)B.ante=+a.wa;if(a.wh2)B.ahead=+a.wh2;re()});
    s.querySelector('#whok').onclick=()=>{Object.assign(WH,W);Object.assign(BOOK,B);s.remove();draw();toast('Horários salvos. Os alunos já veem assim.')}})}
const busy=(d,h)=>(S.ev[d]||[]).some(e=>Math.floor(e.h)===h&&(e.gc||e.st!=='can'))||(spOf(d,h)&&(spOf(d,h).lock||spOf(d,h).req));
function freeCount(i){return HOURS.filter(h=>isWork(i,h)&&!busy(i,h)&&(i!==TODAY||h>NOW)).length}
const reqs=()=>Object.entries(S.sp).flatMap(([d,o])=>Object.entries(o).filter(([h,x])=>x.req).map(([h,x])=>({d:+d,h:+h,x})));
const LOG=[];const logA=t=>LOG.unshift({t,when:'agora'});
function histHTML(){const seen=S.av.filter(a=>a.seen);if(!seen.length&&!LOG.length)return '';
  return `<details class="hist"${S.histOpen?' open':''}><summary data-hist><span>Já vistos e o que você fez</span><span class="note">${seen.length+LOG.length}</span></summary>
    ${LOG.map(l=>`<div class="hrow2"><span class="tag t-ok">Você</span><span>${esc(l.t)}<small> • ${l.when}</small></span></div>`).join('')}
    ${seen.map(a=>`<div class="hrow2"><span class="tag t-${a.t}">${{can:'Cancelou',rem:'Remarcou',new:'Marcou',pau:'Pausa'}[a.t]}</span><span><b>${esc(a.n)}</b> ${esc(a.txt.toLowerCase())}${a.why?' • “'+esc(a.why)+'”':''}<small> • ${a.when}</small></span><button class="mini" data-unseen="${S.av.indexOf(a)}">Marcar não visto</button></div>`).join('')}</details>`}
function needsWrap(R,pend,nb){if(!nb)return needsCard(R,pend,nb);if(!S.needOpen)return `<button class="nbar" data-needs><span class="nb">${nb}</span><span style="min-width:0"><b>${nb===1?'1 coisa precisa':nb+' coisas precisam'} de você</b><small>${R.length?R.length+' pedido'+(R.length>1?'s':'')+' • ':''}${pend.length} aviso${pend.length===1?'':'s'} de alunos • toque para abrir</small></span><span class="go">▾</span></button>`;
  return needsCard(R,pend,nb).replace('<span class="lbl">Precisa de você</span>','<span class="lbl">Precisa de você</span><button class="mini" data-needs>Fechar ▴</button>')}
function needsCard(R,pend,nb){if(nb)return needsCard0(R,pend,nb).replace('</section>',histHTML()+'</section>');const h=histHTML();return h?`<section class="card"><div class="row"><span class="lbl">Avisos</span><span class="st ok">Tudo visto ✓</span></div>${h}</section>`:''}
function needsCard0(R,pend,nb){return nb?`<section class="card"><div class="row"><span class="lbl">Precisa de você</span>${pend.length?'<button class="seen" data-allseen>Todos vistos ✓</button>':''}</div>
    ${R.map(r=>`<div class="av"><span style="min-width:0"><span class="tag t-req">Pedido</span> ${RQT(r.x.req)}<b>${esc(r.x.req.n)}</b><small>Quer ${dayLbl(r.d).toLowerCase()} ${hh(r.h)}, que ${esc(r.x.freed.split(' ')[0])} liberou • ${r.x.req.when}</small></span><div class="rb"><button class="mini solid" data-ok="${r.d}:${r.h}">Confirmar</button><button class="mini" data-no="${r.d}:${r.h}">Recusar</button></div></div>`).join('')}
    ${pend.map(a=>`<div class="av"><span style="min-width:0"><span class="tag t-${a.t}">${{can:'Cancelou',rem:'Remarcou',new:'Marcou',pau:'Pausa'}[a.t]}</span><b>${esc(a.n)}</b><small>${esc(a.txt)} • ${a.when}</small>${a.why?`<q>${esc(a.why)}</q>`:''}</span>${a.t==='can'&&a.d!==undefined&&spOf(a.d,a.h)&&!spOf(a.d,a.h).lock&&!spOf(a.d,a.h).req?`<div class="rb"><button class="mini" data-lock="${a.h}" data-avi="${S.av.indexOf(a)}">Travar</button><button class="mini" data-seen="${S.av.indexOf(a)}">Deixar livre</button></div>`:`<button class="seen" data-seen="${S.av.indexOf(a)}">Visto ✓</button>`}</div>`).join('')}
    <p class="note">Quando um aluno cancela, o horário fica livre sozinho. Se outro aluno pedir, a aula só vale depois que você confirmar.</p></section>`:''}
function drawAgenda(){
  const E=(S.ev[S.day]||[]).slice().sort((a,b)=>a.h-b.h),nx=nextUp(),pend=S.av.filter(a=>!a.seen),R=reqs(),nb=pend.length+R.length;
  document.getElementById('bd').textContent=nb||'';document.getElementById('bd').hidden=!nb;
  const n=E.filter(e=>!e.gc&&e.st!=='can').length;
  let tl='',nowDrawn=false;
  HOURS.forEach(h=>{const here=E.filter(e=>Math.floor(e.h)===h);
    if(S.day===TODAY&&!nowDrawn&&h>NOW){tl+='<div class="now" aria-label="Agora 14:45"></div>';nowDrawn=true}
    const sp=spOf(S.day,h),cx=here.find(e=>e.st==='can'),cw=cx?` • motivo: ${esc(cx.why||'não informado')}`:'',free=!busy(S.day,h)&&isWork(S.day,h)&&!(S.day===TODAY&&h<=NOW);
    if(!here.length&&!free&&!sp)return;
    tl+=`<div class="sl"><span class="h">${hh(h)}</span><div class="b">${here.filter(e=>!(sp&&e.st==='can'&&sp.lock)).map(e=>e.gc?`<div class="ev gc"><span><b>${esc(e.gc)}</b><small>${hh(e.h)} • seus alunos não veem esse horário</small></span><span class="st">Google</span></div>`
      :`<button class="ev ${e.st==='ok'?'done':''} ${e.st==='conf'?'cf':''} ${e.st==='can'?'can':''}${e.st==='can'&&sp&&sp.req&&!sp.lock?' canrq':''} ${e.st==='wait'?'waitc':''}${e.exp?' expc':''}" data-ev="${E.indexOf(e)}"><span style="min-width:0"><b>${esc(e.n)}</b><small>${hh(e.h)} • ${e.st==='can'?'motivo: '+esc(e.why||'não informado'):`📍 ${esc(locOf(e).n)} • ${e.moved?'remarcada':e.extra?'avulsa':'do plano'}${e.by?' • por '+esc(e.by):''}`}</small></span><span class="st ${ST[e.st][0]}">${ST[e.st][1]}</span></button>`).join('')}
      ${sp&&sp.lock?`<div class="lock"><span><b>Bloqueado por você${sp.why?' • '+esc(sp.why.toLowerCase()):''}</b><small>${sp.freed&&sp.freed!=='você'?esc(sp.freed.split(' ')[0])+' cancelou'+cw+' • ':''}os alunos não veem</small></span><button class="mini" data-unlock="${h}">Destravar</button></div>`
       :sp&&sp.req?`<div class="req"><span><b>${esc(sp.req.n)} quer este horário</b><small>pedido ${sp.req.when} • ${esc(sp.freed.split(' ')[0])} cancelou</small></span><div class="rb"><button class="mini solid" data-ok="${S.day}:${h}">Deixar ${esc(sp.req.n.split(' ')[0])} entrar</button><button class="mini" data-lock="${h}">Travar</button></div></div>`
       :sp&&free?`<div class="freed"><span><b>Liberado</b><small>${esc(sp.freed.split(' ')[0])} cancelou${cw} • aberto para os alunos</small></span><div class="rb"><button class="mini" data-lock="${h}">Travar</button><button class="mini" data-free="${h}">+ marcar</button></div></div><button class="sim" data-sim="${h}">simular: um aluno pede esse horário</button>`

  const body=()=>`${L.map(e=>{const k=ENTR.indexOf(e),done=e.it.every(i=>i.ok);return `<div class="entr${done?' done':''}"><div class="row"><span><b>${esc(e.n)}</b><small>Chegou no ${esc(e.lv)} • ${e.d}</small></span>${done?'<span class="st ok">Tudo entregue ✓</span>':''}</div>${e.it.map((it,j)=>`<label class="eit"><input type="checkbox" data-eok="${k}:${j}" ${it.ok?'checked':''} ${it.auto?'disabled':''}><span>${esc(it.t)}${it.auto?' <small>• automático</small>':''}</span></label>`).join('')}</div>`}).join('')||'<p class="note">Nenhum prêmio por aqui.</p>'}
    <p class="note" style="margin:0">Desconto e aula grátis entram sozinhos. Brinde e “outro” você entrega e marca aqui.</p>`;
  sheet(`<span class="lbl">Gamificação</span><h3 class="d">Prêmios a entregar</h3><div id="enb" style="display:flex;flex-direction:column;gap:10px">${body()}</div><button class="btn" data-close>Fechar</button>`,s=>s.addEventListener('change',ev=>{const k=ev.target.dataset.eok;if(!k)return;const [a,b]=k.split(':').map(Number);ENTR[a].it[b].ok=ev.target.checked;setTimeout(()=>{s.querySelector('#enb').innerHTML=body();draw()},0);if(ev.target.checked)toast('Marcado como entregue')}))}
const PRZT={desc:['💸','Desconto','% no próximo pagamento'],aula:['🏋️','Aula grátis','quantas aulas'],brinde:['🎁','Brinde','qual brinde'],rem:['🔁','Remarcação extra','quantas'],outro:['✍️','Outro','escreva o que vai dar']};
const PRZ=[{},{},{},{},{},{}];
const przTxt=p=>Object.entries(p).map(([k,v])=>k==='desc'?v+'% off':k==='aula'?v+(v==1?' aula grátis':' aulas grátis'):k==='rem'?'+'+v+' remarcação':v).filter(Boolean).join(' + ')||'Nada';
function gameHTML(){const T=GTEMA[GAME.tema],P=GAME.pre==='custom'?null:GPRE[GAME.pre],ons=MEDC.filter(m=>GAME.med[m.id]).length;
  if(!GAME.aceito)return `<div class="gterm"><div class="gbig">${badge(GAME.tema,4)}</div><h3 class="d" style="font-size:28px;margin:0">Antes de ligar a gamificação</h3>
    <p>Com a gamificação, seus alunos ganham medalhas e sobem de level conforme treinam. Você escolhe o que cada level dá: desconto, aula grátis, brinde ou o que quiser.</p>
    <div class="info warn"><b>Termo de responsabilidade</b><br>Tudo o que você configurar aqui (prêmios, descontos, aulas grátis, brindes e textos) aparece para os seus alunos e é um compromisso <b>seu</b> com eles. O aplicativo só mostra e conta o que você definiu. Não nos responsabilizamos por prêmios prometidos, valores, erros de digitação ou qualquer combinado entre você e os seus alunos.</div>
    <label class="sw"><span>Li e aceito. Sou responsável pelo que eu oferecer aos meus alunos.</span><input type="checkbox" id="gac"></label>
    <button class="btn solid" data-gaccept>Ativar gamificação</button></div>`;
  return `<label class="sw gon"><span><b>Gamificação ligada</b><br><small class="note">Desligada, some de todos os alunos. Ninguém perde o que já conquistou.</small></span><input type="checkbox" data-gon ${GAME.on?'checked':''}></label>
  ${GAME.on?`<section class="card"><span class="lbl">1. Tema</span><p class="cdesc">O visual das insígnias e o nome do ranking.</p><div class="gth3">${Object.entries(GTEMA).map(([k,t])=>`<button class="gtc" data-gt3="${k}" aria-pressed="${GAME.tema===k}"><span class="gmini">${badge(k,2)}</span><b>${t.n}</b><small>${t.lv[0]} → ${t.lv[4]}</small></button>`).join('')}</div>
    <div class="glv">${T.lv.map((n,i)=>`<div><span class="gmini sm">${badge(GAME.tema,i)}</span><small>${n}</small></div>`).join('')}</div></section>
  <section class="card"><span class="lbl">2. Dificuldade</span><p class="cdesc">Quanto o aluno precisa se dedicar para subir. A frequência já vem certa em cada modo.</p>
    ${GAME.pre==='custom'?`<div class="gmode cus sel"><b>✎ Personalizado</b><small>Montado por você no passo a passo</small></div>
    <div class="info ok">${custTxt(GAME)}</div><div class="fair">${fairTxt(GAME.ciclo)}</div>
    <div class="row2"><button class="btn solid" data-gwiz>✎ Editar passo a passo</button><button class="btn" data-gpre>Usar um modo pronto</button></div>`
    :`<div class="gmodes">${Object.entries(GPRE).map(([k,p])=>`<button class="gmode" data-gm3="${k}" aria-pressed="${GAME.pre===k}"><b>${p.n}${k==='padrao'?' ✓':''}</b><small>${k==='leve'?'Sobe rápido, nunca perde medalha':k==='padrao'?'Recomendado: equilibrado':'Exige constância de verdade'}</small></button>`).join('')}<button class="gmode cus" data-gm3="custom"><b>Personalizado</b><small>Montar do zero, passo a passo</small></button></div>
    <div class="info ok"><b>${P.n}:</b> fecha o ciclo de 4 semanas quem cumprir <b>${P.ciclo}%</b> dos próprios treinos. ${T.lv.slice(1,5).map((n,i)=>`${n} em ${P.niv[i]} ciclos`).join(' • ')}. ${P.perde?'Semana sem check-in tira 1 semana das medalhas.':'Ninguém perde medalha.'}</div><div class="fair">${fairTxt(P.ciclo)}</div>`}
</section>
  <section class="card"><span class="lbl">3. Medalhas</span><p class="cdesc">${ons} de ${MEDC.length} ligadas. Toque para ligar ou desligar: desligada some do app dos alunos.</p>
    <div class="gmeds">${MEDC.map(m=>`<button class="gmed" data-gmt="${m.id}" aria-pressed="${!!GAME.med[m.id]}"><span>${{tempo:'📅',limite:'💪',carga:'🏋️',resist:'❤️',alim:'🥗',agua:'💧',sono:'😴',zero:'🍔',doce:'🍬',perfeita:'⭐',destaque:'🏅',recrutador:'🤝'}[m.id]}</span><b>${m.id==='tempo'?(GAME.tema==='orig'?'Tempo de matilha':'Tempo de casa'):m.n.replace(' (secreta)','')}</b><small>${m.d.replace('X',GAME.dias[m.id]||'')}</small></button>`).join('')}</div></section>
  <section class="card"><span class="lbl">4. Prêmios de cada level</span><p class="cdesc">Pode marcar mais de um. Em branco = sem prêmio.</p>
    <span class="note" style="margin:0">Quem recebe prêmio</span><div class="chips">${[['pres','Presencial'],['online','Online'],['inf','Parceiros']].map(([k,l])=>`<button class="chip" data-gpf="${k}" aria-pressed="${GAME.przFor[k]}">${l}</button>`).join('')}</div>
    <p class="note" style="margin:0">${GAME.przFor.online?'':'Online sobe de level e ganha medalha, mas não recebe prêmio. '}${GAME.przFor.inf?'':'Parceiros não recebem prêmio. '}</p>
    ${T.lv.slice(1).map((n,i)=>`<button class="gprz" data-gpz="${i+1}"><span class="gmini sm">${badge(GAME.tema,i+1)}</span><span style="min-width:0"><b>${n}</b><small>${przTxt(PRZ[i+1])}</small></span><span class="go">›</span></button>`).join('')}</section>
  <section class="card"><span class="lbl">5. Ranking</span><label class="sw"><span><b>Ranking ${T.r}</b><br><small class="note">${GAME.rank?'Os alunos veem a lista com quem está mais à frente':'Sem lista: cada aluno vê só o próprio level e medalhas'}</small></span><input type="checkbox" data-grk ${GAME.rank?'checked':''}></label></section>
  <details class="metd gman"><summary><span><b>📖 Manual: como funciona e como o aluno vê</b><small>Leia antes de mandar para os alunos</small></span><i>▾</i></summary>${gameManual()}</details>`:''}`}
const fairTxt=p=>`<b>Justo para todo mundo:</b> cada aluno fecha <b>1 ciclo</b> cumprindo ${p}% do plano dele. Quem treina 2x por semana tem 8 treinos previstos e fecha com ${Math.ceil(8*p/100)}. Quem treina 6x tem 24 e fecha com ${Math.ceil(24*p/100)}. Os dois ganham o mesmo ciclo.`;
const custTxt=W=>{const T=GTEMA[GAME.tema];return `<b>Seu modo:</b> conta ${Object.entries(W.conta).filter(([k,v])=>v).map(([k])=>({treino:'treinos',check:'check-in do dia',semana:'fechamento da semana',cardio:'cardio'})[k]).join(', ')} • ciclo com ${W.ciclo}% • ${T.lv.slice(1,5).map((n,i)=>n+' em '+W.niv[i]).join(', ')} ciclos • ${MEDC.filter(m=>W.med[m.id]).length} medalhas, ${W.th[0]===2?'rápidas':W.th[0]===4?'normais':'devagar'} • ${W.perde?'perde medalha sem check-in':'nunca perde medalha'} • ${W.prest?T.lv[5]+' a cada '+W.estrela+' ciclos':'sem '+T.lv[5]}.`};
function gameManual(){const T=GTEMA[GAME.tema],c=GAME.pre==='custom'?GAME:GPRE[GAME.pre];
  return `<div class="gmanb">
    <h4>O ciclo</h4><p>Um ciclo são 4 semanas. Se o aluno cumprir ${c.ciclo}% dos treinos previstos para ele, o ciclo conta. A cada ciclo ele chega mais perto do próximo level.</p><div class="fair">${fairTxt(c.ciclo)}</div>
    <h4>Os levels</h4><p>${T.lv.slice(0,5).map((n,i)=>`<b>${n}</b>${i?`: ${c.niv[i-1]} ciclos (~${Math.round(c.niv[i-1]*4/4.3)} meses)`:': entrada'}`).join('<br>')}<br><b>${T.lv[5]}</b>: depois de ${T.lv[4]}, uma estrela nova a cada ${GAME.estrela} ciclos.</p>
    <h4>As medalhas</h4><p>Cada semana em que o aluno bate a meta de uma medalha conta 1. Ela sobe de grau: ${TIERN.map((t,i)=>`${t} (${(c.th||GAME.th)[i]} semanas)`).join(', ')}. Pausa por viagem ou lesão não tira nada.</p>
    <h4>Como o aluno vê</h4><div class="gstu"><span class="gmini">${badge(GAME.tema,2)}</span><div style="min-width:0"><small>Seu level</small><b>${T.lv[2]}</b><div class="bar"><i style="width:60%"></i></div><small>Faltam 2 treinos para fechar o ciclo • ${T.lv[3]} em 5 ciclos</small>${przTxt(PRZ[3])!=='Nada'?`<small>🎁 No ${T.lv[3]}: ${esc(przTxt(PRZ[3]))}</small>`:''}</div></div>
    <h4>Prêmios</h4><p>Quando o aluno sobe, o app comemora e mostra o prêmio. Para você aparece “prêmio a entregar” na agenda. A entrega é com você.</p>
    <p class="note">Lembrete: tudo o que você escrever aparece para os alunos. Revise antes de salvar.</p></div>`}
function gamePage(){const s=sheet(`<span class="lbl">Configurações</span><h3 class="d">Gamificação</h3><div id="gpg" style="display:flex;flex-direction:column;gap:12px">${gameHTML()}</div><button class="btn" data-close>Fechar</button>`,s=>{
    const re=()=>{const y=s.querySelector('.sheet').scrollTop,o=s.querySelector('.gman')&&s.querySelector('.gman').open;s.querySelector('#gpg').innerHTML=gameHTML();if(o)s.querySelector('.gman').open=true;s.querySelector('.sheet').scrollTop=y};
    s.addEventListener('click',e=>{let b;
      if(e.target.closest('[data-gaccept]')){if(!s.querySelector('#gac').checked){toast('Marque que você leu e aceita');return}GAME.aceito=true;re();toast('Gamificação ativada');return}
      if((b=e.target.closest('[data-gt3]'))){GAME.tema=b.dataset.gt3;re();return}
      if((b=e.target.closest('[data-gm3]'))){const k=b.dataset.gm3;if(k==='custom'){gameWizard(re);return}GAME.pre=k;Object.assign(GAME,{ciclo:GPRE[k].ciclo,niv:[...GPRE[k].niv],perde:GPRE[k].perde,th:[...GPRE[k].th]});re();toast(`Modo ${GPRE[k].n}`);return}
      if(e.target.closest('[data-gwiz]')){gameWizard(re);return}
      if(e.target.closest('[data-gpre]')){GAME.pre='padrao';Object.assign(GAME,{ciclo:75,niv:[3,6,12,24],perde:true,th:[4,8,16,26,52]});re();toast('Voltou para o modo Médio');return}
      if((b=e.target.closest('[data-gmt]'))){const k=b.dataset.gmt;GAME.med[k]=!GAME.med[k];if(!MEDC.some(m=>GAME.med[m.id])){GAME.med[k]=true;toast('Deixe pelo menos uma medalha');return}re();return}
      if((b=e.target.closest('[data-gpz]'))){przSheet(+b.dataset.gpz,re);return}
      if((b=e.target.closest('[data-gpf]'))){GAME.przFor[b.dataset.gpf]=!GAME.przFor[b.dataset.gpf];re();return}});
    s.addEventListener('change',e=>{if(e.target.matches('[data-gon]')){GAME.on=e.target.checked;setTimeout(re,0)}if(e.target.matches('[data-grk]')){GAME.rank=e.target.checked;setTimeout(re,0);toast(GAME.rank?'Ranking ligado':'Ranking desligado')}})})}
function przSheet(i,done){const T=GTEMA[GAME.tema],P={...PRZ[i]};
  const body=()=>Object.entries(PRZT).map(([k,[ic,n,ph]])=>`<div class="przr${P[k]!==undefined?' on':''}"><label class="sw" style="background:none;padding:0"><span>${ic} <b>${n}</b></span><input type="checkbox" data-pzk="${k}" ${P[k]!==undefined?'checked':''}></label>${P[k]!==undefined?`<input class="inp" data-pzv="${k}" value="${esc(P[k])}" placeholder="${ph}" ${k==='desc'||k==='aula'||k==='rem'?'inputmode="numeric"':''} style="margin:0">`:''}</div>`).join('');
  sheet(`<span class="lbl">Prêmio</span><div class="row" style="justify-content:flex-start;gap:12px"><span class="gmini">${badge(GAME.tema,i)}</span><h3 class="d" style="margin:0">${T.lv[i]}</h3></div><p class="note" style="margin:0">Marque tudo o que o aluno ganha ao chegar aqui.</p><div id="pzb" style="display:flex;flex-direction:column;gap:8px">${body()}</div>
    <div class="row2"><button class="btn" data-close>Voltar</button><button class="btn solid" id="pzok">Salvar</button></div>`,s=>{
    s.addEventListener('change',e=>{const k=e.target.dataset.pzk;if(k){if(e.target.checked)P[k]=k==='desc'?'10':k==='aula'||k==='rem'?'1':'';else delete P[k];setTimeout(()=>{s.querySelector('#pzb').innerHTML=body();const f=s.querySelector(`[data-pzv="${k}"]`);f&&f.focus()},0)}});
    s.addEventListener('input',e=>{const k=e.target.dataset.pzv;if(k)P[k]=e.target.value});
    s.querySelector('#pzok').onclick=()=>{PRZ[i]=Object.fromEntries(Object.entries(P).filter(([k,v])=>String(v).trim()));s.remove();done();toast(`${T.lv[i]}: ${przTxt(PRZ[i])}`)}})}
function gameWizard(done){const T=GTEMA[GAME.tema],src=GAME.pre==='custom'?GAME:{ciclo:75,niv:[3,6,12,24],perde:true,conta:{treino:true,check:false,semana:false,cardio:false},estrela:6,th:[4,8,16,26,52],prest:true,bon:{ind:false,desafio:false},med:Object.fromEntries(MEDC.map(m=>[m.id,true])),dias:Object.fromEntries(MEDC.filter(m=>m.dias).map(m=>[m.id,m.dias]))};
  const W=JSON.parse(JSON.stringify({ciclo:src.ciclo,niv:src.niv,perde:src.perde,conta:src.conta,estrela:src.estrela,th:src.th,prest:src.prest,bon:src.bon,med:src.med,dias:src.dias}));let st=0;
  const N=7,card=(ic,t,d,inner)=>`<div class="wcard"><div class="wtop"><span class="wic">${ic}</span><span>Passo ${st+1} de ${N}</span></div><h4>${t}</h4><p>${d}</p>${inner}</div>`;
  const yn=(k,y,n,v)=>`<div class="wopts"><button class="wopt" data-wy="${k}:1" aria-pressed="${v}">${y}</button><button class="wopt" data-wy="${k}:0" aria-pressed="${!v}">${n}</button></div>`;
  const pages=[
    ()=>card('📋','O que conta para o ciclo?','Escolha o que o aluno precisa fazer para o ciclo valer. Pode marcar mais de um.','<div class="wopts">'+[['treino','💪 Treinos feitos','os treinos marcados para ele'],['check','📝 Check-in do dia','responder as perguntas diárias'],['semana','📅 Fechamento da semana','peso e recado de domingo'],['cardio','❤️ Cardio','os cardios da semana']].map(([k,l,d])=>`<button class="wopt" data-wc="${k}" aria-pressed="${W.conta[k]}">${l}<small>${d}</small></button>`).join('')+'</div>'),
    ()=>card('🎯','Quanto ele precisa cumprir?','Em 4 semanas, qual a parte mínima do que você marcou?',`<div class="wopts">${[50,60,75,90,100].map(v=>`<button class="wopt" data-wp="${v}" aria-pressed="${W.ciclo===v}">${v}%${v===75?' • recomendado':''}</button>`).join('')}</div><div class="fair">${fairTxt(W.ciclo)}</div>`),
    ()=>card('🪜','Quanto tempo para cada level?','Cada ciclo são 4 semanas. Toque − ou + em cada insígnia.',T.lv.slice(1,5).map((n,i)=>`<div class="wlv"><span class="gmini sm">${badge(GAME.tema,i+1)}</span><span><b>${n}</b><small>~${Math.round(W.niv[i]*4/4.3)} meses</small></span><span class="stp"><button data-wl="${i}:-1" aria-label="Menos">−</button><b>${W.niv[i]}</b><button data-wl="${i}:1" aria-label="Mais">+</button></span></div>`).join('')),
    ()=>card('🏅','Quais medalhas o aluno vai ter?','Ligue ou desligue. Nas de dias, escolha quantos dias da semana contam.',`<div class="wmeds">${MEDC.map(m=>`<div class="wmed${W.med[m.id]?' on':''}"><button class="wmt" data-wm="${m.id}"><span>${{tempo:'📅',limite:'💪',carga:'🏋️',resist:'❤️',alim:'🥗',agua:'💧',sono:'😴',zero:'🍔',doce:'🍬',perfeita:'⭐',destaque:'🏅',recrutador:'🤝'}[m.id]}</span><span style="min-width:0"><b>${m.id==='tempo'?(GAME.tema==='orig'?'Tempo de matilha':'Tempo de casa'):m.n}</b><small>${m.d.replace('X',W.dias[m.id]||'')}</small></span><i>${W.med[m.id]?'✓':''}</i></button>${m.dias&&W.med[m.id]?`<div class="stp sm"><button data-wdd="${m.id}:-1" aria-label="Menos">−</button><b>${W.dias[m.id]} de 7</b><button data-wdd="${m.id}:1" aria-label="Mais">+</button></div>`:''}</div>`).join('')}</div>`),
    ()=>card('⏱️','As medalhas sobem rápido ou devagar?','Cada semana batendo a meta conta 1 para a medalha.',`<div class="wopts">${[['Rápido',[2,4,8,13,26]],['Normal',[4,8,16,26,52]],['Devagar',[6,12,24,40,78]]].map(([n,a])=>`<button class="wopt" data-wt="${a.join(',')}" aria-pressed="${W.th[0]===a[0]}">${n}<small>${TIERN.map((t,i)=>t+' '+a[i]).join(' • ')} semanas</small></button>`).join('')}</div>`),
    ()=>card('⚖️','Perde medalha?','Se o aluno passar a semana inteira sem check-in. Pausa por viagem ou lesão nunca conta.',yn('perde','Sim, perde 1 semana','Não, nunca perde',W.perde)),
    ()=>card('✨',T.lv[5]+' e resumo','Depois do último level, o aluno pode continuar subindo no '+T.lv[5]+'.',`${yn('prest','Usar o '+T.lv[5],'Não usar',W.prest)}${W.prest?`<p style="margin:4px 0 0">Uma estrela nova a cada:</p><div class="wopts">${[3,6,12].map(v=>`<button class="wopt" data-we="${v}" aria-pressed="${W.estrela===v}">${v} ciclos</button>`).join('')}</div>`:''}<div class="info ok">${custTxt(W)}</div>`)];
  sheet(`<span class="lbl">Personalizado</span><div class="wdots" id="wdots"></div><div id="wzb"></div><div class="row2"><button class="btn" id="wback">Voltar</button><button class="btn solid" id="wnext">Próximo</button></div>`,s=>{
    const re=()=>{s.querySelector('#wzb').innerHTML=pages[st]();s.querySelector('#wdots').innerHTML=Array.from({length:N},(_,i)=>`<i class="${i<=st?'on':''}"></i>`).join('');s.querySelector('#wnext').textContent=st===N-1?'Salvar meu modo':'Próximo';s.querySelector('#wback').textContent=st?'Voltar':'Cancelar'};re();
    s.addEventListener('click',e=>{let b;if((b=e.target.closest('[data-wc]'))){const k=b.dataset.wc;W.conta[k]=!W.conta[k];if(!Object.values(W.conta).some(Boolean)){W.conta[k]=true;toast('Marque pelo menos um')}re()}
      if((b=e.target.closest('[data-wp]'))){W.ciclo=+b.dataset.wp;re()}
      if((b=e.target.closest('[data-wl]'))){const [i,v]=b.dataset.wl.split(':').map(Number);W.niv[i]=Math.max(i?W.niv[i-1]+1:1,Math.min(60,W.niv[i]+v));for(let j=i+1;j<4;j++)if(W.niv[j]<=W.niv[j-1])W.niv[j]=W.niv[j-1]+1;re()}
      if((b=e.target.closest('[data-wm]'))){const k=b.dataset.wm;W.med[k]=!W.med[k];if(!MEDC.some(m=>W.med[m.id])){W.med[k]=true;toast('Deixe pelo menos uma medalha')}re()}
      if((b=e.target.closest('[data-wdd]'))){const [k,v]=b.dataset.wdd.split(':');W.dias[k]=Math.max(1,Math.min(7,W.dias[k]+ +v));re()}
      if((b=e.target.closest('[data-wt]'))){W.th=b.dataset.wt.split(',').map(Number);re()}
      if((b=e.target.closest('[data-wy]'))){const [k,v]=b.dataset.wy.split(':');W[k]=v==='1';re()}
      if((b=e.target.closest('[data-wb]'))){W.bon[b.dataset.wb]=!W.bon[b.dataset.wb];re()}
      if((b=e.target.closest('[data-we]'))){W.estrela=+b.dataset.we;re()}});
    s.querySelector('#wback').onclick=()=>{if(!st){s.remove();return}st--;re()};

function cropper(src,done){const img=new Image();img.onload=()=>{
  const ov=document.createElement('div');ov.className='crop';ov.setAttribute('role','dialog');ov.setAttribute('aria-label','Ajustar foto');
  ov.innerHTML=`<span class="lbl" style="color:#aaa">Ajustar foto</span><p class="d" style="font-size:30px;margin:0;color:#fff">Arraste e dê zoom</p>
    <div class="cstage" id="cs"><img id="ci" src="${src}" alt="" draggable="false"><span class="cring"></span></div>
    <label class="czoom"><span>−</span><input type="range" id="cz" min="1" max="4" step="0.01" value="1" aria-label="Zoom"><span>+</span></label>
    <div class="row2" style="width:280px"><button class="btn" id="cx" style="color:#fff;border-color:#555">Cancelar</button><button class="btn" id="cok" style="background:#fff;color:#000;border-color:#fff">Usar foto</button></div>`;
  document.body.appendChild(ov);
  const S0=280,el=ov.querySelector('#ci'),st=ov.querySelector('#cs'),zr=ov.querySelector('#cz'),base=Math.max(S0/img.width,S0/img.height);let z=1,x=0,y=0;
  const clamp=()=>{const w=img.width*base*z,h=img.height*base*z;x=Math.min((w-S0)/2,Math.max(-(w-S0)/2,x));y=Math.min((h-S0)/2,Math.max(-(h-S0)/2,y))};
  const paint=()=>{clamp();el.style.width=img.width*base*z+'px';el.style.height=img.height*base*z+'px';el.style.transform=`translate(calc(-50% + ${x}px),calc(-50% + ${y}px))`};paint();
  const pts=new Map();let drag=null,pinch=null;
  st.addEventListener('pointerdown',e=>{st.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);if(pts.size===1)drag=[e.clientX-x,e.clientY-y];if(pts.size===2){const [a,b]=[...pts.values()];pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1]),z}}});
  st.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,[e.clientX,e.clientY]);if(pts.size===2&&pinch){const [a,b]=[...pts.values()];z=Math.min(4,Math.max(1,pinch.z*Math.hypot(a[0]-b[0],a[1]-b[1])/pinch.d));zr.value=z;paint()}else if(drag){x=e.clientX-drag[0];y=e.clientY-drag[1];paint()}});
  const up=e=>{pts.delete(e.pointerId);if(pts.size<2)pinch=null;if(!pts.size)drag=null;else{const [v]=[...pts.values()];drag=[v[0]-x,v[1]-y]}};st.addEventListener('pointerup',up);st.addEventListener('pointercancel',up);
  st.addEventListener('wheel',e=>{e.preventDefault();z=Math.min(4,Math.max(1,z*(e.deltaY<0?1.06:.94)));zr.value=z;paint()},{passive:false});
  zr.oninput=()=>{z=+zr.value;paint()};ov.querySelector('#cx').onclick=()=>ov.remove();
  ov.querySelector('#cok').onclick=()=>{const c=document.createElement('canvas');c.width=c.height=480;const k=480/S0,g=c.getContext('2d');g.beginPath();g.arc(240,240,240,0,Math.PI*2);g.clip();
    const w=img.width*base*z,h=img.height*base*z;g.drawImage(img,(S0/2-w/2+x)*k,(S0/2-h/2+y)*k,w*k,h*k);ov.remove();done(c.toDataURL('image/png'))}};img.src=src}
